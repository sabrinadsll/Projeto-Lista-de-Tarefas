<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas - Sabrina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="js/main.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="cabecalho shadow-sm text-center">
        <h1 class="fw-bold m-0">Lista de Tarefas</h1>
    </header>

    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center mb-4">
            <div class="col-md-8">
                <input type="text" id="campo-busca" class="form-control shadow-sm" placeholder="🔍 Procurar tarefa...">
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card cartao-azul shadow-sm p-4">
                    <form id="formulario-tarefa" class="row g-3">
                        <input type="hidden" id="idTarefa">
                        <div class="col-md-7">
                            <input type="text" id="input-titulo" class="form-control border-0"
                                placeholder="O que você precisa fazer?" required>
                        </div>
                        <div class="col-md-3">
                            <select id="input-prioridade" class="form-select border-0">
                                <option value="" selected disabled>Prioridade</option>
                                <option value="Baixa">Baixa</option>
                                <option value="Media">Média</option>
                                <option value="Alta">Alta</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-ok w-100 fw-bold text-white">OK</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="row justify-content-center mt-5">

            <ul id="lista-tarefas" class="col-md-8 list-unstyled">

            
                <li class="item-tarefa concluida d-flex justify-content-between align-items-center shadow-sm">
                    <div class="d-flex align-items-center flex-grow-1">
                        <div class="custom-checkbox">
                            <input type="checkbox" checked disabled>
                        </div>
                        <div class="ms-3">
                            <strong class="titulo-tarefa">Estudar para a prova do Dann</strong>
                            <span class="badge-prioridade">Concluída</span>
                        </div>
                    </div>
                    <div class="acoes d-flex gap-2">
                        <button class="btn-excluir">Excluir</button>
                    </div>
                </li>

               
            </ul>
        </div>
    </main>

    <footer class="rodape p-3 text-center mt-auto">
        <p class="m-0">Site desenvolvido por <strong>Sabrina Dias Lima</strong></p>
        <small>Trabalho Final - Front-End II - IFPI</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
